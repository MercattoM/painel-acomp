<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel RCS · Central Mercatto</title>
<style>
:root{--navy:#0a1647;--navy2:#143a7b;--cyan:#38bdf8;--ink:#0f1b3d;--mut:#64708a;--bg:#f4f7fc;--card:#fff;--line:#e3e9f4;--ok:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:28px 0 64px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.back{color:#bfe6fb;text-decoration:none;font-size:13px}
.back:hover{color:#fff}
h1{margin:14px 0 4px;font-size:34px;letter-spacing:-.5px}
header p{margin:0;color:#c9d6f0}
main{margin-top:-40px;padding-bottom:40px}
.filtros{display:flex;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:0 8px 24px rgba(10,22,71,.08)}
.filtros label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
.filtros select,.filtros input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;min-width:150px}
.filtros select:focus-visible,.filtros input:focus-visible{outline:2px solid var(--cyan)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.kpi small{color:var(--mut);font-size:13px}
.kpi b{display:block;font-size:30px;letter-spacing:-.5px;margin-top:2px}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
h2{font-size:17px;margin:0 0 14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:200px;overflow-x:auto;padding-bottom:4px}
.bar{flex:1 0 26px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;background:linear-gradient(var(--cyan),#2b7de0);border-radius:6px 6px 0 0;min-height:2px}
.bar span{margin-top:4px}
.bar em{font-style:normal;color:var(--ink);font-size:11px;margin-bottom:3px}
.cart{margin-bottom:12px}
.cart div{display:flex;justify-content:space-between;font-size:14px}
.cart u{display:block;height:8px;border-radius:99px;background:#e8eefa;margin-top:5px;overflow:hidden;text-decoration:none}
.cart u i{display:block;height:100%;background:var(--cyan);border-radius:99px}
.cart small{color:var(--mut)}
.tab{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
td.n,th.n{text-align:right}
.vazio{color:var(--mut);padding:20px 0}
footer{color:var(--mut);font-size:12.5px;text-align:center;padding-bottom:28px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="back" href="../index.html">← Central Mercatto</a>
  <h1>Painel RCS</h1>
  <p id="atual">Envios, custo e carteiras dos disparos de RCS.</p>
</div></header>

<main class="wrap">
  <section class="filtros" aria-label="Filtros">
    <label>Carteira<select id="fCart"><option value="">Todas</option></select></label>
    <label>De<input type="date" id="fDe"></label>
    <label>Até<input type="date" id="fAte"></label>
  </section>

  <section class="kpis">
    <div class="card kpi"><small>Envios</small><b id="kEnv">–</b></div>
    <div class="card kpi"><small>Custo total</small><b id="kCus">–</b></div>
    <div class="card kpi"><small>Custo por envio</small><b id="kMed">–</b></div>
    <div class="card kpi"><small>Dias com disparo</small><b id="kDia">–</b></div>
  </section>

  <section class="grid">
    <div class="card"><h2>Envios por dia</h2><div class="bars" id="bars"></div></div>
    <div class="card"><h2>Por carteira</h2><div id="carts"></div></div>
  </section>

  <section class="card tab">
    <h2>Disparos</h2>
    <table><thead><tr><th>Dia</th><th>Carteira</th><th class="n">Envios</th><th class="n">Custo</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main>
<footer>Portal de acompanhamento Mercatto</footer>

<script>
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("pt-BR"), brl=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const dia=d=>d.split("-").reverse().join("/");
let dados=[];

fetch("dados.json?v="+Date.now()).then(r=>r.json()).then(j=>{
  dados=j.registros||j;
  if(j.atualizado_em) $("atual").textContent="Dados atualizados em "+j.atualizado_em;
  [...new Set(dados.map(x=>x.carteira))].sort().forEach(c=>$("fCart").add(new Option(c,c)));
  const ds=dados.map(x=>x.data).sort();
  $("fDe").value=ds[0]||""; $("fAte").value=ds[ds.length-1]||"";
  ["fCart","fDe","fAte"].forEach(i=>$(i).addEventListener("change",draw));
  draw();
}).catch(()=>{$("rows").innerHTML='<tr><td colspan="4" class="vazio">Não foi possível carregar dados.json. Rode o script atualiza_rcs.py e publique o arquivo.</td></tr>'});

function draw(){
  const c=$("fCart").value,de=$("fDe").value,ate=$("fAte").value;
  const f=dados.filter(x=>(!c||x.carteira===c)&&(!de||x.data>=de)&&(!ate||x.data<=ate));
  const env=f.reduce((s,x)=>s+x.envios,0), cus=f.reduce((s,x)=>s+x.custo,0);
  $("kEnv").textContent=nf.format(env); $("kCus").textContent=brl.format(cus);
  $("kMed").textContent=env?brl.format(cus/env):"–";
  $("kDia").textContent=new Set(f.map(x=>x.data)).size;

  const pd={}; f.forEach(x=>pd[x.data]=(pd[x.data]||0)+x.envios);
  const dias=Object.keys(pd).sort(), mx=Math.max(1,...Object.values(pd));
  $("bars").innerHTML=dias.length?dias.map(d=>`<div class="bar" title="${dia(d)}: ${nf.format(pd[d])} envios"><em>${nf.format(pd[d])}</em><i style="height:${pd[d]/mx*150}px"></i><span>${dia(d).slice(0,5)}</span></div>`).join(""):'<div class="vazio">Sem disparos no período.</div>';

  const pc={}; f.forEach(x=>{const o=pc[x.carteira]||(pc[x.carteira]={e:0,c:0});o.e+=x.envios;o.c+=x.custo});
  const cs=Object.entries(pc).sort((a,b)=>b[1].e-a[1].e), mc=Math.max(1,...cs.map(x=>x[1].e));
  $("carts").innerHTML=cs.map(([n,o])=>`<div class="cart"><div><b>${n}</b><span>${nf.format(o.e)}</span></div><u><i style="width:${o.e/mc*100}%"></i></u><small>${brl.format(o.c)}</small></div>`).join("")||'<div class="vazio">Sem dados.</div>';

  $("rows").innerHTML=[...f].sort((a,b)=>b.data.localeCompare(a.data)||a.carteira.localeCompare(b.carteira)).map(x=>`<tr><td>${dia(x.data)}</td><td>${x.carteira}</td><td class="n">${nf.format(x.envios)}</td><td class="n">${brl.format(x.custo)}</td></tr>`).join("");
}
</script>
</body>
</html>
